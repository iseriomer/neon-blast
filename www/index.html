<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Neon Blast</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Game UI Layer -->
    <div id="ui-layer">
        <div id="xp-container">
            <div id="xp-bar">
                <div id="xp-fill"></div>
            </div>
            <div id="xp-info-row">
                <div id="level-indicator" data-i18n="level">Level: 1</div>
                <div id="xp-text">0 / 1000</div>
            </div>
        </div>
        <div id="boss-hud" style="display: none;">
            <div id="boss-name">OMEGA CORE</div>
            <div id="boss-hp-bar">
                <div id="boss-hp-fill"></div>
            </div>
        </div>
        <div id="shield-indicator"></div>
        <!-- FPS Counter (Hidden by default) -->
        <div id="fps-counter" style="display: none;">FPS: 60</div>

        <!-- Pause Button -->
        <button id="pause-btn">┃┃</button>
    </div>

    <!-- Pause Menu (Hidden by default) -->
    <div id="pause-menu" class="hidden">
        <h2 data-i18n="paused">PAUSED</h2>
        <div class="pause-options">
            <div style="display:flex; justify-content:center; margin-bottom:15px;">
                <button onclick="Localization.setLanguage('tr')"
                    style="background:#222; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">TR</button>
                <button onclick="Localization.setLanguage('en')"
                    style="background:#222; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">EN</button>
                <button onclick="Localization.setLanguage('fr')"
                    style="background:#222; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">FR</button>
                <button onclick="Localization.setLanguage('es')"
                    style="background:#222; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">ES</button>
                <button onclick="Localization.setLanguage('de')"
                    style="background:#222; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">DE</button>
                <button onclick="Localization.setLanguage('it')"
                    style="background:#222; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">IT</button>
            </div>
            <label class="toggle-container">
                <input type="checkbox" id="fps-toggle">
                <span class="checkmark"></span>
                <span data-i18n="show_fps">Show FPS</span>
            </label>
            <label class="toggle-container">
                <input type="checkbox" id="sfx-toggle" checked>
                <span class="checkmark"></span>
                <span data-i18n="sfx">SFX</span>
            </label>
            <label class="toggle-container">
                <input type="checkbox" id="screenshake-toggle">
                <span class="checkmark"></span>
                <span data-i18n="screen_shake">Screen Shake</span>
            </label>
            <label class="toggle-container">
                <input type="checkbox" id="joystick-toggle">
                <span class="checkmark"></span>
                <span data-i18n="joystick">Joystick Mode</span>
            </label>
            <label class="toggle-container">
                <input type="checkbox" id="music-toggle">
                <span class="checkmark"></span>
                <span data-i18n="music">Music</span>
            </label>
            <div class="track-selector">
                <button id="prev-track-btn" class="arrow-btn">❮</button>
                <span id="current-track-name">Track Name</span>
                <button id="next-track-btn" class="arrow-btn">❯</button>
            </div>
            <div class="slider-container" style="display: flex; flex-direction: column; width: 100%; margin: 10px 0;">
                <label for="music-volume" style="font-size: 0.8rem; margin-bottom: 5px;" data-i18n="music_volume">Music
                    Volume</label>
                <input type="range" id="music-volume" min="0" max="1" step="0.1" value="0.6"
                    style="width: 100%; cursor: pointer;">
            </div>
        </div>
        <button class="main-btn" id="resume-btn" data-i18n="resume_btn">RESUME</button>
    </div>

    <div id="start-screen">
        <h1>NEON BLAST</h1>
        <p data-i18n="start_desc">Protect the center. Destroy enemies.<br>Fill the XP bar to EVOLVE.</p>
        <button class="main-btn" id="start-btn" data-i18n="start_btn">START GAME</button>
        <button class="main-btn" id="leaderboard-btn" data-i18n="leaderboard_btn">LEADERBOARD</button>

        <div class="lang-selector" style="margin-top: 20px;">
            <button onclick="Localization.setLanguage('tr')"
                style="background:none; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">TR</button>
            <button onclick="Localization.setLanguage('en')"
                style="background:none; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">EN</button>
            <button onclick="Localization.setLanguage('fr')"
                style="background:none; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">FR</button>
            <button onclick="Localization.setLanguage('es')"
                style="background:none; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">ES</button>
            <button onclick="Localization.setLanguage('de')"
                style="background:none; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">DE</button>
            <button onclick="Localization.setLanguage('it')"
                style="background:none; border:1px solid #00ffff; color:#00ffff; cursor:pointer; padding:5px 10px; margin:0 5px;">IT</button>
        </div>
    </div>

    <!-- Leaderboard Screen (New) -->
    <div id="leaderboard-screen" class="hidden"
        style="position: absolute; top: 0; left: 0; width: 100%; height: 100%; background: rgba(5,5,10,0.98); flex-direction: column; align-items: center; justify-content: center; z-index: 25;">
        <h1 style="color: #00ffff;">LEADERBOARD</h1>

        <div class="leaderboard-filters" style="display: flex; gap: 10px; margin-bottom: 10px; margin-top: 10px;">
            <button id="lb-filter-all" class="filter-btn" data-i18n="lb_all_time">ALL TIME</button>
            <button id="lb-filter-monthly" class="filter-btn" data-i18n="lb_monthly">MONTHLY</button>
            <button id="lb-filter-weekly" class="filter-btn" data-i18n="lb_weekly">WEEKLY</button>
        </div>

        <div class="leaderboard-container">
            <h3>TOP 10 PLAYERS</h3>
            <ul id="main-leaderboard-list">
                <li>Loading...</li>
            </ul>
        </div>
        <button class="main-btn" id="close-leaderboard-btn" style="margin-top: 30px;">BACK</button>
    </div>

    <!-- Game Over Screen -->
    <div id="game-over-screen" class="hidden">
        <h1 style="color: #ff0055; -webkit-text-fill-color: #ff0055; text-shadow: 5px 5px 0 #800000;"
            data-i18n="game_over">GAME OVER</h1>
        <p id="final-score">Score: 0</p>

        <div id="leaderboard-section">
            <input type="text" id="player-name-input" placeholder="ENTER INITIALS" maxlength="10"
                data-i18n="enter_initials">
            <button class="main-btn" id="submit-score-btn" style="padding: 10px 30px; font-size: 1rem;"
                data-i18n="save_score">SAVE
                SCORE</button>

            <div class="leaderboard-filters"
                style="display: flex; gap: 10px; margin-bottom: 10px; margin-top: 10px; justify-content: center;">
                <button id="lb-filter-all-go" class="filter-btn" data-i18n="lb_all_time">ALL TIME</button>
                <button id="lb-filter-monthly-go" class="filter-btn" data-i18n="lb_monthly">MONTHLY</button>
                <button id="lb-filter-weekly-go" class="filter-btn" data-i18n="lb_weekly">WEEKLY</button>
            </div>

            <div class="leaderboard-container">
                <h3>TOP 10 PLAYERS</h3>
                <ul id="leaderboard-list">
                    <li data-i18n="loading">Loading...</li>
                </ul>
            </div>
        </div>
        <button class="main-btn" id="restart-btn" style="margin-top: 20px;" data-i18n="play_again">PLAY AGAIN</button>
    </div>

    <!-- Level Up / Perk Selection Screen -->
    <div id="levelup-screen" class="hidden">
        <h2 data-i18n="level_up">LEVEL UP!</h2>
        <p data-i18n="choose_perk">Choose a perk:</p>
        <div class="perk-container" id="perk-list"></div>
    </div>

    <!-- Admin Panel -->
    <div id="admin-panel" class="hidden">
        <h3>🛠️ ADMIN PANEL</h3>
        <div class="admin-grid">
            <button onclick="adminGodMode()" id="btn-godmode">🛡️ God Mode: OFF</button>
            <button onclick="adminLevelUp()">⬆️ Level Up</button>
            <button onclick="adminKillAll()">💀 Kill All</button>
            <button onclick="adminAddScore()">💰 +5000 Score</button>
            <button onclick="adminMaxFireRate()">🔫 Machine Gun</button>
            <button onclick="adminSpawnBoss()">😈 Spawn Boss</button>
        </div>
        <div class="admin-info">
            Panel: <b>H</b> | Profiler: <b>P</b>
        </div>
    </div>

    <!-- Joystick Controls -->
    <div id="joystick-zone"></div>
    <div id="joystick-base">
        <div id="joystick-stick"></div>
    </div>

    <!-- Tracer Overlay -->
    <svg id="tracer-overlay">
        <line id="tracer-line" x1="0" y1="0" x2="0" y2="0" />
    </svg>

    <canvas id="gameCanvas"></canvas>

    <!-- Load Firebase Leaderboard -->
    <script type="module" src="game/leaderboard.js"></script>

    <!-- CAPACITOR RUNTIME - Load first for mobile builds -->
    <script src="capacitor.js"></script>

    <!-- OPTIMIZATION NOTE: Load order is critical! -->
    <!-- 1. Constants and utilities first -->
    <script src="game/constants.js"></script>
    <script src="game/audio.js"></script>
    <script src="game/lang.js"></script>

    <!-- 2. NEW: Performance profiler -->
    <script src="game/performance-profiler.js"></script>

    <!-- 3. NEW: Spatial grid for collision optimization -->
    <script src="game/spatial-grid.js"></script>

    <!-- 4. NEW: Batch renderer -->
    <script src="game/optimized-renderer.js"></script>

    <!-- 5. Core systems -->
    <script src="game/objectPool.js"></script>
    <script src="game/particle.js"></script>

    <!-- 6. REPLACE: Optimized projectile system -->
    <script src="game/projectile-OPTIMIZED.js"></script>

    <!-- 7. Original systems -->
    <script src="game/enemy.js"></script>

    <!-- Audio System -->
    <script src="game/managers/MusicManager.js"></script>
    <script src="game/music/Track1.js"></script>
    <script src="game/music/Track2.js"></script>
    <script src="game/music/Track3.js"></script>
    <script src="game/music/Track4.js"></script>
    <script src="game/music/Track5.js"></script>
    <script src="game/music/Track6.js"></script>
    <script src="game/music/Track7.js"></script>
    <script src="game/music/Track8.js"></script>

    <!-- 8. REPLACE: Optimized player -->
    <script src="game/player-OPTIMIZED.js"></script>

    <script src="game/perks.js"></script>
    <script src="game/ui.js"></script>
    <script src="game/bosses/BossBase.js"></script>
    <script src="game/boss.js"></script>
    <script src="game/boss_2.js"></script>
    <script src="game/boss_3.js"></script>
    <script src="game/boss_4.js"></script>
    <script src="game/boss_5.js"></script>
    <script src="game/boss_6.js"></script>
    <script src="game/boss_7.js"></script>
    <script src="game/boss_8.js"></script>

    <!-- NEW: Refactored Managers & Skills -->
    <script src="game/managers/CollisionManager.js"></script>
    <script src="game/managers/SpawnManager.js"></script>
    <script src="game/joystick.js"></script>
    <script src="game/managers/InputManager.js"></script>
    <script src="game/managers/BossManager.js"></script>
    <script src="game/skills/BlackHole.js"></script>
    <script src="game/skills/Lightning.js"></script>

    <!-- 9. REPLACE: Main game loop with all optimizations -->
    <script src="game/game-OPTIMIZED.js"></script>
    <script src="game/background.js"></script>
    <script src="game/admin.js"></script>

    <script>
        // Initialize systems
        initAdminPanel();

        // Show optimization tips on load
        console.log('%c⚡ PERFORMANCE OPTIMIZATIONS ACTIVE ⚡', 'color: #0f0; font-size: 16px; font-weight: bold;');
        console.log('%cPress "P" to toggle Performance Profiler', 'color: #0ff;');
        console.log('%cPress "H" to toggle Admin Panel', 'color: #0ff;');
        console.log('%c📊 Key Optimizations:', 'color: #ff0; font-weight: bold;');
        console.log('  ✓ Spatial Grid Collision Detection (O(n*m) → O(n))');
        console.log('  ✓ Batch Rendering (400 calls → 5 calls)');
        console.log('  ✓ Dynamic Quality Adjustment');
        console.log('  ✓ Projectile Cap (Max 250)');
        console.log('  ✓ Reduced Shadow Rendering');
        console.log('  ✓ Optimized Homing Logic');
    </script>
</body>

</html>
